networks:
  netlanvas_internal:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETLANVAS_SUBNET:-172.28.1.0/24}

services:
  # REDISAUTH-1 (2026-09-21): one-shot, dependency-free -- generates
  # this install's Redis IPC password on first run only, into the
  # same ./config mount netlanvas_core/netlanvas_api already use for
  # other generate-once-persist secrets (TLS cert, device identity
  # key). Its own service (not folded into core/api's own startup)
  # specifically to avoid a circular dependency: redis needs this
  # file before ITS OWN startup, but core/api already wait on redis
  # being healthy. Uses the same published image as everything else
  # in this file -- no separate image to publish or keep in sync.
  redis_secrets_init:
    image: netlanvas.com/netlanvas:latest
    container_name: netlanvas_redis_secrets_init
    restart: "no"
    volumes:
      - ./config:/app/config
    command:
      - python3
      - -c
      - |
        import os, secrets
        p = "/app/config/redis.key"
        if not os.path.exists(p):
            with open(p, "w") as f:
                f.write(secrets.token_hex(32))
            os.chmod(p, 0o600)
            print("[*] Redis Secrets Init: generated a new install-unique password.")
        else:
            print("[*] Redis Secrets Init: existing password found, leaving it alone.")

  redis:
    image: redis:alpine
    container_name: netlanvas_redis
    restart: unless-stopped
    networks:
      netlanvas_internal:
        ipv4_address: ${REDIS_INTERNAL_IP:-172.28.1.10}
    volumes:
      - ./config:/app/config:ro
    # REDISAUTH-1: reads the generated password at container-start
    # time (runtime, via this shell wrapper) rather than a literal --
    # deliberately NOT docker compose's own ${...} interpolation,
    # which resolves at `up` invocation time, before redis_secrets_init
    # has had a chance to generate anything on a first-ever run.
    command: >
      sh -c 'redis-server --requirepass "$(cat /app/config/redis.key)" --save ""'
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # --save "" disables RDB snapshotting entirely. Redis here is
    # purely ephemeral pub/sub-style IPC between netlanvas_core and
    # netlanvas_api (engine tick, TLS SAN publishing) -- nothing
    # stored in it needs to survive a restart (confirmed by the
    # existing graceful fallback when a value is missing, e.g. "No
    # host address published yet"). With no snapshot ever attempted,
    # the MISCONF/stop-writes-on-bgsave-error failure mode can never
    # trigger again, for any reason -- this closes the whole class
    # of problem rather than fixing one specific instance of it.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$(cat /app/config/redis.key)\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      redis_secrets_init:
        condition: service_completed_successfully

  netlanvas_core:
    image: netlanvas.com/netlanvas:latest
    container_name: netlanvas_core
    restart: unless-stopped
    network_mode: "host"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE # LICENSE-1: DHCP sniffer binds UDP/67, a privileged port
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config:/app/config
      - ./db:/app/db
    environment:
      - NETLANVAS_ROLE=POLLER
      - TZ=Europe/London
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=${REDIS_INTERNAL_IP:-172.28.1.10}
      - REDIS_PORT=6379
      - WATCHTOWER_INTERNAL_IP=${WATCHTOWER_INTERNAL_IP:-172.28.1.11}
      - WATCHTOWER_API_TOKEN=${WATCHTOWER_API_TOKEN:-NetlanvasWatchtowerInternalToken123!}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      redis_secrets_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  netlanvas_api:
    image: netlanvas.com/netlanvas:latest
    container_name: netlanvas_api
    restart: unless-stopped
    networks:
      - netlanvas_internal
    volumes:
      - ./config:/app/config
      - ./db:/app/db
      - ./tls:/app/tls
      - ./caddy:/app/caddy
    environment:
      - NETLANVAS_ROLE=API_VIEWER
      - TZ=Europe/London
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=${REDIS_INTERNAL_IP:-172.28.1.10}
      - REDIS_PORT=6379
      - NETLANVAS_TLS_EXTRA_SANS=${NETLANVAS_PUBLIC_ADDR:-}
      - WATCHTOWER_INTERNAL_IP=${WATCHTOWER_INTERNAL_IP:-172.28.1.11}
      - WATCHTOWER_API_TOKEN=${WATCHTOWER_API_TOKEN:-NetlanvasWatchtowerInternalToken123!}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      redis_secrets_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: netlanvas_caddy
    restart: unless-stopped
    networks:
      - netlanvas_internal
    ports:
      - "8899:8899"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/etc/netlanvas-tls:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      netlanvas_api:
        condition: service_healthy

  # Powers ALERT-7/update automation: pure HTTP-trigger mode (no
  # periodic polling of its own -- WATCHTOWER_HTTP_API_UPDATE without
  # --http-api-periodic-polls disables it entirely) so nothing updates
  # on Watchtower's own schedule. netlanvas_core's already-existing
  # hourly update-check (main.py's maybe_check_for_update /
  # maybe_update_infra_images) is the sole scheduler: redis/caddy are
  # triggered unconditionally every hour (base infra, not this
  # product's own release cycle, low behavior-change risk), the
  # NetLanvas app image only updates via this same trigger if the user
  # opted into AUTO_UPDATE_APP, or via the Settings page's manual
  # "Update Now" button either way -- never silently on its own.
  #
  # No host port published -- reachable only from other containers on
  # netlanvas_internal (netlanvas_core reaches it via its bridge IP
  # despite being network_mode: host itself; netlanvas_api reaches it
  # by container name). The token matters less than that network
  # isolation, same reasoning as redis's own hardcoded password above.
  watchtower:
    image: nickfedor/watchtower
    container_name: netlanvas_watchtower
    restart: unless-stopped
    networks:
      netlanvas_internal:
        ipv4_address: ${WATCHTOWER_INTERNAL_IP:-172.28.1.11}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_API_TOKEN:-NetlanvasWatchtowerInternalToken123!}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
