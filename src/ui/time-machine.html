<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlanvas | Time Machine</title>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="shortcut icon" href="assets/favicon.ico">
    <script src="vendor/tailwindcss.js"></script>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <script src="auth-guard.js"></script>
    <style>
        /* position+z-index required so body forms its own stacking context --
           otherwise the negative-z-index watermark below gets hidden behind
           body's own bg-gray-900 background instead of painting above it. */
        body { position: relative; z-index: 0; }
        body::before {
            content: ""; position: fixed; inset: 0;
            background-image: url('/dashboard/NetLanvas%20Logo.png');
            background-repeat: no-repeat; background-position: center; background-size: contain;
            opacity: 0.10; pointer-events: none; z-index: -1;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 font-sans antialiased">
    <main class="w-[90vw] mx-auto p-8">
        <header class="mb-8 border-b border-gray-800 pb-4 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-bold text-amber-500 tracking-widest uppercase">Time Machine</h1>
                <p class="text-xs text-cyan-500 font-mono mt-1">Manage and load historical infrastructure snapshots.</p>
            </div>
            <div id="toast" class="hidden font-mono text-xs px-4 py-2 rounded shadow-lg transition-all duration-300"></div>
        </header>

        <div class="bg-gray-800 rounded-lg border border-gray-700 shadow-xl overflow-hidden">
            <table class="w-full text-left font-mono text-sm">
                <thead class="bg-gray-900/50 border-b border-gray-700 text-cyan-400">
                    <tr>
                        <th class="p-4 w-48">Snapshot UTC</th>
                        <th class="p-4 w-24">Size</th>
                        <th class="p-4 w-1/4">Location Tag</th>
                        <th class="p-4">Notes</th>
                        <th class="p-4 text-right w-48">Actions</th>
                    </tr>
                </thead>
                <tbody id="archive-list" class="divide-y divide-gray-700/50">
                    <tr><td colspan="5" class="p-8 text-center text-cyan-500 animate-pulse">Scanning archive volume...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const escapeHTML = (str) => {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>'"]/g, match => {
                const escapeMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' };
                return escapeMap[match];
            });
        };

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `font-mono text-xs px-4 py-2 rounded shadow-lg transition-all duration-300 ${type === 'success' ? 'bg-green-900/50 text-green-400 border border-green-500/50' : 'bg-red-900/50 text-red-400 border border-red-500/50'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        async function fetchArchives() {
            try {
                const res = await fetch('/api/archives');
                const data = await res.json();
                const tbody = document.getElementById('archive-list');
                tbody.innerHTML = '';

                if (!data.archives || data.archives.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-cyan-500">No archived databases found.</td></tr>';
                    return;
                }

                data.archives.forEach((arc, index) => {
                    tbody.insertAdjacentHTML('beforeend', `
                        <tr class="hover:bg-gray-750 transition group">
                            <td class="p-4 text-blue-400 font-bold">${escapeHTML(arc.timestamp)}</td>
                            <td class="p-4 text-cyan-400">${escapeHTML(arc.size_mb)} MB</td>
                            <td class="p-4">
                                <input type="text" id="loc-${index}" value="${escapeHTML(arc.location)}" class="w-full bg-gray-900 border border-gray-600 text-gray-200 text-xs p-1 rounded focus:border-blue-500 outline-none" placeholder="e.g. Site Alpha">
                            </td>
                            <td class="p-4">
                                <input type="text" id="note-${index}" value="${escapeHTML(arc.notes)}" class="w-full bg-gray-900 border border-gray-600 text-gray-200 text-xs p-1 rounded focus:border-blue-500 outline-none" placeholder="Optional notes...">
                            </td>
                            <td class="p-4 text-right space-x-2">
                                <button onclick="saveAnnotation('${escapeHTML(arc.filename)}', ${index})" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-2 py-1 rounded shadow transition text-xs opacity-0 group-hover:opacity-100" title="Save Metadata">Save</button>
                                <button onclick="triggerLoad('${escapeHTML(arc.filename)}')" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1 rounded shadow transition text-xs" title="Load DB">Load</button>
                                <button onclick="deleteArchive('${escapeHTML(arc.filename)}')" class="bg-red-600 hover:bg-red-500 text-white font-bold px-2 py-1 rounded shadow transition text-xs" title="Destroy File">X</button>
                            </td>
                        </tr>
                    `);
                });
            } catch (e) {
                document.getElementById('archive-list').innerHTML = '<tr><td colspan="5" class="p-8 text-center text-red-500">API Connection Failed</td></tr>';
            }
        }

        async function saveAnnotation(filename, index) {
            const loc = document.getElementById(`loc-${index}`).value;
            const notes = document.getElementById(`note-${index}`).value;
            try {
                const res = await fetch('/api/archives/annotate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({filename: filename, location: loc, notes: notes})
                });
                const data = await res.json();
                if (data.success) showToast("Metadata saved.", 'success');
                else showToast(data.error, 'error');
            } catch (e) { showToast("API fault.", 'error'); }
        }

        async function deleteArchive(filename) {
            if (!confirm(`WARNING: Are you sure you want to permanently destroy snapshot: ${filename}?`)) return;
            try {
                const res = await fetch('/api/archives/delete', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({filename: filename})
                });
                const data = await res.json();
                if (data.success) {
                    showToast("Snapshot destroyed.", 'success');
                    fetchArchives();
                } else showToast(data.error, 'error');
            } catch (e) { showToast("API fault.", 'error'); }
        }

        function triggerLoad(filename) {
            if (window.parent && window.parent.loadArchive) {
                window.parent.loadArchive(filename);
            } else {
                showToast("Cannot communicate with parent orchestrator.", "error");
            }
        }

        fetchArchives();
    </script>
</body>
</html>
